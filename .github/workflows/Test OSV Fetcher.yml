name: Safe Daily OSV Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'

concurrency:
  group: seckeeper-osv-sync
  cancel-in-progress: false

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests cvss
      - name: Conservatively merge OSV candidates and rebuild manifest
        run: python build_repo.py --sync-osv
      - name: Commit only validated changes
        run: |
          if git diff --quiet -- cve_rules.json manifest.json; then
            echo "No safely convertible new CVE rules."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add cve_rules.json manifest.json
          git commit -m "chore: safe daily CVE rule sync [skip ci]"
          git push
