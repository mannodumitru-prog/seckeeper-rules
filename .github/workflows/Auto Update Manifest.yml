name: Validate Rules and Update Manifest

on:
  push:
    branches: [main]
    paths:
      - '*.json'
      - 'pocs/**.py'
      - 'yaml_pocs/**.yaml'
      - 'yaml_pocs/**.yml'
      - 'build_repo.py'
      - '!manifest.json'
  workflow_dispatch:

concurrency:
  group: seckeeper-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository and rebuild manifest
        run: python build_repo.py
      - name: Commit manifest when changed
        run: |
          if git diff --quiet -- manifest.json; then
            echo "Manifest is already current."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: validate rules and update manifest [skip ci]"
          git push
